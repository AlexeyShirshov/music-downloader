[package]
name = "yandex-music-downloader"
version = "3.5.6"
edition = "2021"
rust-version = "1.89"
description = "Загрузчик музыки с сервиса Яндекс.Музыка (Rust port)"
license = "MIT"
repository = "https://github.com/llistochek/yandex-music-downloader"
readme = "README.md"

[[bin]]
name = "ymd"
path = "src/main.rs"

[dependencies]
aes = "0.8"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
ctr = "0.9"
env_logger = "0.11"
hex = "0.4"
hmac = "0.12"
log = "0.4"
lofty = "0.25"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = true }
url = "2"

[dev-dependencies]
hex = "0.4"
lofty = "0.25"
serde_json = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
