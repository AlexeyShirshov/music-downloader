name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Как повысить версию"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  version:
    name: Bump version
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      previous: ${{ steps.previous.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: bash scripts/bump-version.sh "$BUMP"

      - name: Previous tag
        id: previous
        run: |
          previous="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
          echo "tag=$previous" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Тег $TAG уже существует"
            exit 1
          fi
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $TAG"
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "$TAG"

  build:
    name: ${{ matrix.artifact }}
    needs: version
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional || false }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact: music-downloader-linux-x86_64
            binary: music-downloader
            musl: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: music-downloader-macos-arm64
            binary: music-downloader
            optional: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: music-downloader-macos-x86_64
            binary: music-downloader
            optional: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: music-downloader-windows-x86_64.exe
            binary: music-downloader.exe
            crt_static: true

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (Linux musl)
        if: matrix.musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (Windows, static CRT)
        if: matrix.crt_static
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (macOS)
        if: ${{ !matrix.musl && !matrix.crt_static }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.version.outputs.tag }}
          # Нужна вся история: раздел «Что нового» строится по коммитам
          # между предыдущим тегом и новым.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Collect changes
        env:
          TAG: ${{ needs.version.outputs.tag }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
        run: bash scripts/release-changelog.sh "$PREVIOUS" "$TAG" > changelog.md

      - name: Render release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
          REPOSITORY: ${{ github.repository }}
          CHANGES_FILE: changelog.md
        run: python3 scripts/render-release-notes.py

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --notes-file release-notes.md \
              --verify-tag
          fi
