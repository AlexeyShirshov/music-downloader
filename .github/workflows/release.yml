name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Тег релиза, например v3.5.6"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-24.04
    steps:
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1 || gh release create "$TAG" \
            -R "${{ github.repository }}" \
            --title "$TAG" \
            --notes "Rust port of yandex-music-downloader: self-contained binaries for Linux, Windows and macOS. No Python, pip or VC++ Redistributable required."

  build:
    name: ${{ matrix.artifact }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue-on-error || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact: ymd-linux-x86_64
            binary: ymd
            musl: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ymd-macos-arm64
            binary: ymd
            continue-on-error: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ymd-macos-x86_64
            binary: ymd
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ymd-windows-x86_64.exe
            binary: ymd.exe
            crt_static: true

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (Linux musl)
        if: matrix.musl
        working-directory: rust
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (Windows, static CRT)
        if: matrix.crt_static
        working-directory: rust
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (macOS)
        if: ${{ !matrix.musl && !matrix.crt_static }}
        working-directory: rust
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary to release (Unix)
        if: matrix.os != 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          cp "rust/target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.artifact }}"
          gh release upload "$TAG" "${{ matrix.artifact }}" --clobber -R "${{ github.repository }}"

      - name: Upload binary to release (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          copy "rust\target\${{ matrix.target }}\release\${{ matrix.binary }}" "${{ matrix.artifact }}"
          gh release upload "$TAG" "${{ matrix.artifact }}" --clobber -R "${{ github.repository }}"
