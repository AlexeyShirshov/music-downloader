# Конфигурация cargo-deny: https://embarkstudios.github.io/cargo-deny/
#
# Проверяется в CI (.github/workflows/security.yml): уязвимости, лицензии,
# запрещённые зависимости и источники пакетов.

[graph]
targets = []

[advisories]
version = 2
yanked = "warn"
# Unmaintained-крейты проверяем только среди прямых зависимостей проекта:
# транзитивные (например, paste через lofty в dev-графе) не наша зона контроля
# и обновляются вместе с родителем.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
# Разрешены только permissive-лицензии, совместимые с MIT.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
